plugins {
    id 'java-library'
}

group = 'net.jhotreload'
version = '1.3.3'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.jar
        {
            manifest
                    {
                        attributes(
                                "Implementation-Title": "JHotReload",
                                "Implementation-Version": project.version,
                                "Automatic-Module-Name": "net.jhotreload"
                        )
                    }
        }